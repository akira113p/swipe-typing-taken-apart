<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your finger never types the word</title>
<meta name="description" content="Swipe a word across a keyboard and watch how your phone actually guesses it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/stage.css"><link rel="stylesheet" href="css/phone.css"><link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/charts.css"><link rel="stylesheet" href="css/overview.css"><link rel="stylesheet" href="css/diagram.css">
</head>
<body>
<header class="top">
  <h1>Your finger never types the word</h1>
  <div class="rule2"></div>
  <p class="lead" data-text="lead"></p>
  <svg id="opening" class="opening" role="img" aria-label="A straight swipe of hello passes over the keys h g f t r e r t y h j k l o; the keyboard writes hello."></svg>
</header>
<main class="demo">
  <h2><span class="plate">Plate I.</span> Swipe a word</h2>
  <p class="hint"><span data-text="hint"></span>
    <button class="chip" data-demo="hello">hello</button> <button class="chip" data-demo="keyboard">keyboard</button>
    <button class="chip" data-demo="thanks">thanks</button> <button class="chip" data-demo="tip">tip</button>
    <button class="chip" data-demo="you">you</button></p>
  <div class="stage">
    <div class="board">
      <div class="phone">
        <img class="phone-frame" src="img/phone-frame.png" alt="">
        <p id="screen-text" class="screen-text" aria-live="polite" aria-label="What you have typed" data-placeholder="Swipe on the keys below. Your words appear here."></p>
        <div id="suggestions" class="suggestions" aria-label="The three words with the most votes"></div>
        <svg id="keyboard" role="img" aria-label="A keyboard you can swipe on"></svg>
      </div>
      <div class="apart"><h3 class="small-h">Take it apart</h3><div data-controls="switches"></div></div></div>
    <section class="result" aria-live="polite">
      <div id="verdict-word" class="verdict-word">…</div><p id="verdict-meta" class="verdict-meta"></p>
      <div id="runners" class="runners"></div><div id="funnel" class="funnel"></div>
      <details class="under"><summary>Tune every number</summary>
        <div data-controls="sliders"></div><button data-reset class="button" type="button">Back to the defaults</button></details>
      <details class="under"><summary>Under the hood</summary><table><thead><tr><th>Word</th><th>Shape gap</th>
        <th>Place gap</th><th>Letters gap</th><th>Per million</th><th>Points</th><th>Vote</th></tr></thead>
        <tbody id="detail-rows"></tbody></table></details>
    </section>
  </div>
  <section class="explain"><h2 class="sub">How it decides</h2>
    <div id="overview"></div>
    <h3>6. Your settings against the defaults</h3><p data-text="accuracyShort"></p>
    <div class="test"><div class="test-controls"><div data-controls="switches"></div><div data-controls="sliders"></div>
      <button data-reset class="button" type="button">Back to the defaults</button></div>
      <div><button id="run-accuracy" class="button" type="button">Run the test</button> <span id="accuracy-status" class="figcap"></span>
        <svg id="accuracy-chart" class="chart"></svg><div id="word-wall" class="word-wall"></div>
        <p class="figcap" data-text="accuracyCaption"></p><p class="try" data-text="accuracyTry"></p></div></div>
  </section>
</main>
<footer class="notes">
  <p class="honest" data-text="honest"></p><p data-text="changes"></p><p data-text="short"></p>
  <ol><li id="fn1" data-text="fn1"></li><li id="fn2" data-text="fn2"></li><li data-text="fn3"></li></ol>
  <p data-text="source"></p>
</footer>
<script type="module" src="ui/opening.js"></script>
<script type="module" src="ui/main.js"></script>
</body>
</html>
