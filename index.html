<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your finger never types the word</title>
<meta name="description" content="Swipe a word across a keyboard and watch how your phone actually guesses it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Alegreya+SC&family=IM+Fell+English&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <button id="lang-toggle" class="lang" type="button">Português</button>
  <h1 data-i18n="title">Your finger never types the word</h1>
  <div class="rule2"></div>
  <p class="lead" data-i18n="lead"></p>
</header>

<main class="demo">
  <h2><span class="plate" data-i18n="plate">Plate I.</span> <span data-i18n="heading">Swipe a word</span></h2>
  <p class="hint"><span data-i18n="hint">Slide your finger (or mouse) across the keys. Or try:</span>
    <button class="chip" data-demo="keyboard">keyboard</button>
    <button class="chip" data-demo="thanks">thanks</button>
    <button class="chip" data-demo="music">music</button>
    <button class="chip" data-demo="tip">tip</button>
    <button class="chip" data-demo="hello">hello</button>
  </p>

  <div class="stage">
    <div class="board">
      <svg id="keyboard" role="img"></svg>
      <p class="figcap" data-i18n="boardCaption"></p>
    </div>

    <section class="result" aria-live="polite">
      <div id="verdict-word" class="verdict-word">…</div>
      <p id="verdict-meta" class="verdict-meta"></p>
      <div id="runners" class="runners"></div>
      <p id="funnel" class="funnel"></p>

      <h3 class="small-h" data-i18n="takeApart"></h3>
      <label class="switch"><input type="checkbox" id="use-shape" checked><span data-i18n="shapeSwitch"></span></label>
      <label class="switch"><input type="checkbox" id="use-place" checked><span data-i18n="placeSwitch"></span></label>
      <label class="switch"><input type="checkbox" id="use-prior" checked><span data-i18n="priorSwitch"></span></label>
      <p class="figcap" data-i18n="tipHint"></p>

      <details class="under">
        <summary data-i18n="underHood"></summary>
        <table>
          <thead><tr><th data-i18n="thWord"></th><th data-i18n="thShape"></th><th data-i18n="thPlace"></th>
            <th data-i18n="thFrequency"></th><th data-i18n="thVote"></th></tr></thead>
          <tbody id="detail-rows"></tbody>
        </table>
        <p class="figcap" data-i18n="underCaption"></p>
      </details>
    </section>
  </div>
</main>

<footer class="notes">
  <p class="honest" data-i18n="honest"></p>
  <ol>
    <li id="fn1" data-i18n="fn1"></li>
    <li id="fn2" data-i18n="fn2"></li>
  </ol>
</footer>
<script type="module" src="ui/app.js"></script>
</body>
</html>
